name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build (fails on invalid frontmatter or unreviewed content)
        run: npm run build
      - name: Guard against content that belongs elsewhere
        run: |
          if grep -rliE "gmail\.com|facebook\.com|instagram\.com" dist --include=*.html; then
            echo "Found a link that should not be on this site."; exit 1
          fi
